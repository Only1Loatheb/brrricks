[workspace]
resolver = "3"
members = [
  "type_process_builder",
  "examples/in_memory_process_runner",
  "examples/qrios_api_process_runner",
  "examples/qrios_api_process_entry",
  "examples/qrios_api_axum_server",
  "examples/qrios_api_reqwest_client",
  "xtask",
]
default-members = [
  "type_process_builder",
  "examples/in_memory_process_runner",
  "examples/qrios_api_process_runner",
  "examples/qrios_api_process_entry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Only1Loatheb/brrricks"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
inline_always = "allow" # I hope the frunk guys done the measurements
missing_errors_doc = "allow"
default_trait_access = "allow" # Denying it causes repetitive code in phantom data initialisation
type_complexity = "allow" # sorry for complex types
