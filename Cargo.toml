[workspace]
resolver = "3"
members = [
  "type_process_builder",
  "examples/in_memory_process_runner",
  "examples/qrios_api_process_runner",
  "examples/qrios_api_process_entry",
  "examples/qrios_api_axum_server",
  "examples/qrios_api_reqwest_client",
  "xtask",
]
default-members = [
  "type_process_builder",
  "examples/in_memory_process_runner",
  "examples/qrios_api_process_runner",
  "examples/qrios_api_process_entry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Only1Loatheb/brrricks"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
#expect_used = "deny"
indexing_slicing = "deny"
#arithmetic_side_effects = "deny"
#unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
#todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
