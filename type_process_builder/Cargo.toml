[package]
name = "type_process_builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "Type-safe process modelling library with compile-time flow and parameter invariants"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Only1Loatheb/brrricks"
readme = "../README.md"
keywords = ["type-state", "process", "workflow", "ussd", "builder"]
categories = ["asynchronous", "rust-patterns"]
exclude = ["examples/", "tests/"]

[lints]
workspace = true

[features]
docs = ["dep:simple-mermaid"]
process-runner-api = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0" # should be this error
postcard = { version = "1.0", features = ["alloc"] }
simple-mermaid = { version = "0.2.0", optional = true }
typenum = "1.0"

[dev-dependencies]
in_memory_process_runner = { path = "../examples/in_memory_process_runner" }
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread"] }
type_process_builder = { path = ".", features = ["docs", "process-runner-api"] }
trybuild = "1.0"
