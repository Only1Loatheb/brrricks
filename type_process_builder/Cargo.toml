[package]
name = "type_process_builder"
version.workspace = true
edition.workspace = true
rust-version = "1.92.0"
description = "Type-safe process modelling library with compile-time flow and parameter invariants"
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["type-state", "process", "workflow", "ussd", "builder"]
categories = ["asynchronous", "rust-patterns"]
exclude = ["examples/", "tests/"]

[features]
docs = ["dep:simple-mermaid"]
process-runner-api = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
simple-mermaid = { version = "0.2.0", optional = true }
typenum = "1.0"

[dev-dependencies]
in_memory_process_runner = { path = "../examples/in_memory_process_runner" }
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread"] }
type_process_builder = { path = ".", features = ["docs", "process-runner-api"] }
ui_test = "0.30"
public-api = { version = "0.52", default-features = false }
rustdoc-json = "0.9"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
inline_always = "allow" # I hope the frunk guys done the measurements
missing_errors_doc = "allow"
default_trait_access = "allow" # Denying it causes repetitive code in phantom data initialisation
type_complexity = "allow" # sorry for complex types
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
#arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
