pre-push:
  commands:
    - |
      if git merge-base --is-ancestor HEAD @{u}; then
        echo "Already pushed"
        exit 1
      else
        echo "We have new commit to work with"
      fi
    - |
      if [ -z "$(git status --porcelain)" ]; then
        echo "All changes in files known to git are committed"
      else
        echo "Committing local changes"
        git add -A && git commit --amend --no-edit
        exit 1
      fi
    - cargo +nightly check --all-targets -p type_process_builder -p in_memory_process_runner -p qrios_api_process_runner -p qrios_api_process_entry
    - cargo +nightly fmt -p type_process_builder -p in_memory_process_runner -p qrios_api_process_runner -p qrios_api_process_entry
    - |
      cargo +nightly fix --all-targets --all-features --allow-dirty \
      -p type_process_builder -p in_memory_process_runner -p qrios_api_process_runner -p qrios_api_process_entry
    - |
      cargo +nightly clippy --fix --allow-dirty --all-targets --all-features \
      -p type_process_builder -p in_memory_process_runner -p qrios_api_process_runner -p qrios_api_process_entry
    - |
      if [ -z "$(git status --porcelain)" ]; then
        echo "Automated fixes already applied"
      else
        echo "Committing automated fixes"
        git add -A && git commit --amend --no-edit
        exit 1
      fi
    - |
      cargo +nightly clippy --all-targets --all-features -p type_process_builder -p in_memory_process_runner -p qrios_api_process_runner -p qrios_api_process_entry
    - |
      cargo +nightly llvm-cov --package type_process_builder \
      --fail-under-regions 84 --fail-under-functions 97 --fail-under-lines 93
#    - cargo +nightly mutants -p type_process_builder --jobs 8
    - cargo +nightly test -p qrios_api_process_runner
    - cargo +nightly xtask
    - |
      if [ -z "$(git status --porcelain)" ]; then
        echo "All autogenerated files were updated"
      else
        echo "Committing autogenerated files"
        git add -A && git commit --amend --no-edit
        exit 1
      fi
    - cargo +stable test -p type_process_builder --lib --test process_builder_tests --test error_accumulation_tests
    - cargo +stable test -p type_process_builder --doc
    - cargo +1.92.0 test -p type_process_builder --lib --test process_builder_tests --test error_accumulation_tests
    - cargo +1.92.0 test -p type_process_builder --doc
