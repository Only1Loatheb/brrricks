# cargo-mutants configuration
# See https://mutants.rs/

exclude_re = [
    # Split case headers (`case_index`) never yield; when `previous_run_yielded_at.0 == self.case_index`,
    # both `<` (`split_process_before`) and `<=` (`this_case` -> `Subprocess`) return `Err(ProcessError::InvalidStepIndex)`.
    "replace < with <= in <impl .* for .*CaseOf.*SplitProcess<.*>>::resume_run",

    # Equivalent mutants: Default::default() for unit types produces the exact same value.
    "replace <impl .* for HNil>::.* with Default::default\\(\\)",
    "replace <impl Extract<HNil, HNil> for Source>::extract -> HNil with Default::default\\(\\)",

    # Equivalent mutant: CNil is uninhabited (`enum CNil {}`), so `<CNil as Display>::fmt` is unreachable at runtime.
    "replace <impl Display for CNil>::fmt -> fmt::Result with Ok\\(Default::default\\(\\)\\)",
]
